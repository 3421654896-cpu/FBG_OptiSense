  - {id: 6, peak_index: 5, name: "指腹右侧", x: 0.316800, y: 0.272006, orientation_deg: 0}
  - {id: 7, peak_index: 6, name: "根部左侧", x: -0.221475, y: -0.025950, orientation_deg: 0}
  - {id: 8, peak_index: 7, name: "根部中部", x: 0.047662, y: -0.025950, orientation_deg: 0}
