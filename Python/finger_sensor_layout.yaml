version: 1
# 当前光路中九根机械手指FBG默认读取CH1。若实际接到其他PD通道，只改这里或界面下拉框。
channel: 1
baseline_frames: 20
activation_pm: 5.0
full_scale_pm: 100.0

# 九个光栅埋在顶面硅胶层内，实物为横平竖直的3×3网格。
# 位置由黄色XY原点、G1/G3/G7/G9机床坐标和CAD实际宽高重新解算；
# 三列共用同一组x，三行共用同一组y，中间行/列取两端的几何中点。
# 下面按峰1～9从指尖到根部、每行从左到右映射；若熔接顺序不同只交换peak_index。
# x/y是整个CAD正面的归一化坐标，x左负右正，y根部负、指尖正。
sensors:
  - {id: 1, peak_index: 0, name: "指尖左侧", x: -0.221475, y: 0.569962, orientation_deg: 0}
  - {id: 2, peak_index: 1, name: "指尖中部", x: 0.047662, y: 0.569962, orientation_deg: 0}
  - {id: 3, peak_index: 2, name: "指尖右侧", x: 0.316800, y: 0.569962, orientation_deg: 0}
